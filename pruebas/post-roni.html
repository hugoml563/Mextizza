<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Post — Pizza Roni</title>
<link rel="stylesheet" href="/styles.css">
<style>
  /* Lienzo exacto de Instagram en 4:5. Se captura tal cual, sin escalar. */
  html, body { margin: 0; padding: 0; background: #FFF; }
  .lienzo {
    width: 1080px;
    height: 1350px;
    position: relative;
    overflow: hidden;
    background: var(--negro-carbon);
  }

  /* La foto manda: ocupa todo y el texto se apoya sobre ella. */
  .foto {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 42%;
  }

  /* Degradado para que el texto se lea sin taparle la orilla tatemada. */
  .velo {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 46%;
    background: linear-gradient(to bottom,
      rgba(26,26,26,0) 0%,
      rgba(26,26,26,.55) 34%,
      rgba(26,26,26,.93) 72%,
      #1A1A1A 100%);
  }

  /* La cinta de la marca separa la foto del bloque de texto. */
  .cinta {
    position: absolute;
    left: 0; right: 0;
    bottom: 306px;
    height: 9px;
    background: repeating-linear-gradient(115deg,
      #1A1A1A 0 22px, #D9A65C 22px 44px,
      #C1502E 44px 66px, #E4007C 66px 88px);
  }

  .bloque {
    position: absolute;
    left: 72px; right: 72px;
    bottom: 74px;
  }

  .titular {
    font-family: 'Colo Pro', 'Oswald', sans-serif;
    font-size: 74px;
    line-height: 1.04;
    color: var(--blanco-hueso);
    margin: 0;
    letter-spacing: -.005em;
    text-wrap: balance;
  }

  .pie {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
    margin-top: 34px;
  }

  .precio {
    font-family: 'Colo Pro', 'Oswald', sans-serif;
    font-size: 62px;
    line-height: 1;
    color: #E8734E;   /* terracota aclarado: sobre negro necesita más luz */
    margin: 0;
  }

  .nombre {
    font-family: 'Bungee', 'Oswald', sans-serif;
    font-size: 21px;
    letter-spacing: .18em;
    color: var(--dorado-masa);
    margin: 0;
    text-align: right;
  }

  /* Marca discreta arriba: la foto es la protagonista, no el logo. */
  .marca {
    position: absolute;
    top: 60px; left: 72px;
    font-family: 'Bungee', 'Oswald', sans-serif;
    font-size: 19px;
    letter-spacing: .2em;
    color: var(--blanco-hueso);
    text-shadow: 0 2px 18px rgba(26,26,26,.75);
    margin: 0;
  }
</style>
</head>
<body>
  <div class="lienzo">
    <img class="foto" src="/assets/photos/pizza-roni.webp" alt="Pizza Roni de Mextizza">
    <div class="velo"></div>
    <p class="marca">MEXTIZZA</p>
    <div class="cinta"></div>
    <div class="bloque">
      <p class="titular">Hay días de experimentar y hay días de peperoni.</p>
      <div class="pie">
        <p class="precio">$189</p>
        <p class="nombre">PIZZA RONI</p>
      </div>
    </div>
  </div>
</body>
</html>
