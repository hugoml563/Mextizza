<!doctype html><meta charset="utf-8">
<body style="margin:0;background:#222">
<video id="v" src="/.tmp-video/horno.mp4" muted playsinline style="width:300px"></video>
<canvas id="c" style="width:600px"></canvas>
<script>
window.hoja = async function () {
  const v = document.getElementById('v');
  await new Promise(ok => { if (v.readyState >= 2) ok(); else v.onloadeddata = ok; });
  const info = { dur: v.duration, w: v.videoWidth, h: v.videoHeight };

  const COLS = 3, FILAS = 2, N = COLS * FILAS;
  const CW = 420, CH = Math.round(CW * v.videoHeight / v.videoWidth);
  const c = document.getElementById('c'), x = c.getContext('2d');
  c.width = CW * COLS; c.height = CH * FILAS;
  x.fillStyle = '#111'; x.fillRect(0, 0, c.width, c.height);

  for (let i = 0; i < N; i++) {
    const t = (v.duration * (i + 0.5)) / N;
    v.currentTime = t;
    await new Promise(ok => { v.onseeked = ok; });
    await new Promise(r => setTimeout(r, 120));
    x.drawImage(v, (i % COLS) * CW, Math.floor(i / COLS) * CH, CW, CH);
    x.fillStyle = 'rgba(0,0,0,.75)';
    x.fillRect((i % COLS) * CW, Math.floor(i / COLS) * CH, 86, 26);
    x.fillStyle = '#fff'; x.font = '600 15px monospace';
    x.fillText(t.toFixed(1) + 's', (i % COLS) * CW + 8, Math.floor(i / COLS) * CH + 18);
  }
  const b64 = c.toDataURL('image/png').split(',')[1];
  const r = await fetch('/__save', { method: 'POST', body: JSON.stringify({ path: '.tmp-video/hoja.png', b64 }) });
  return { info, guardado: await r.json() };
};
</script>
