<!-- Real single-screen app entry point — this is what ships inside the Capacitor .apk.
     index.html stays the 6-screens-at-once design review gallery; do not merge them. -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mextizza</title><link rel="icon" type="image/png" href="../../assets/social/mextizza-app-icon-512.png"><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="../../_ds_bundle.js"></script><script src="../menu-data.js"></script><script src="../delivery-zone.js"></script><script src="../sheets-config.js"></script><script type="text/babel" src="../DeliveryForm.jsx"></script><script type="text/babel" src="AppScreens.jsx"></script><style>
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--negro-carbon)}
#root{height:100%;display:flex}
/* Real device build: the "Phone" mockup frame fills the actual screen instead of
   sitting as a 390x844 bordered card inside a design-review page. */
.app-phone-frame{width:100vw!important;height:100vh!important;height:100dvh!important;border:none!important;border-radius:0!important;box-shadow:none!important}
/* The device's own OS status bar already shows the clock/battery — hide the fake mockup one. */
.app-status-bar{display:none!important}
</style></head><body><div id="root"></div><script>
// Visible fallback so a JS crash shows a readable message on the device
// instead of a silent blank/black screen (we can't pull adb logcat here).
window.addEventListener('error', function (e) {
  var root = document.getElementById('root');
  if (root && !root.hasChildNodes()) {
    // textContent, no innerHTML: el mensaje de error es texto que no
    // controlamos y no debe poder inyectar marcado en la pagina.
    var caja = document.createElement('div');
    caja.setAttribute('style', 'padding:24px;font-family:monospace;font-size:13px;color:#1A1A1A;background:#F5F0E8;white-space:pre-wrap');
    caja.textContent = 'Error al cargar la app: ' + (e.message || 'desconocido') +
      ' ' + (e.filename ? (e.filename + ':' + e.lineno) : '');
    root.appendChild(caja);
  }
});
</script><script type="text/babel" src="AppMobile.jsx"></script></body></html>
