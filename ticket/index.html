<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu ticket · Mextizza</title>
<!-- El ticket de un cliente: se abre solo con su enlace (folio y clave van
     despues de #). Ni se indexa ni deja la clave en otras paginas. -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="/assets/social/mextizza-app-icon-512.png">
<meta name="theme-color" content="#1A1A1A">
<link rel="stylesheet" href="/tokens/fonts.css">
<script src="/ui_kits/sheets-config.js"></script>
<script src="/templates/sales-center/ticket.js"></script>
<style id="estilos-ticket"></style>
<style>
/* La pagina es solo el ticket, como el papel que sale de la impresora, y dos
   botones. Al imprimir (o "Guardar como PDF") sale el ticket solo. */
@media screen{
  html,body{background:#F5F0E8}
  .hoja{max-width:420px;margin:0 auto;padding:22px 16px 40px}
  .papel{background:#fff;padding:18px 16px 22px;border-radius:4px;box-shadow:0 8px 24px rgba(26,26,26,.12);
    -webkit-mask:radial-gradient(circle 6px at 50% 100%,#0000 98%,#000) 0 0/16px 100%}
}
.acciones{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.acciones a,.acciones button{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:10px;
  font:700 14px/1 'Oswald',Arial,sans-serif;letter-spacing:1px;text-transform:uppercase;text-decoration:none;cursor:pointer}
.primario{background:#E4007C;color:#fff;border:0;box-shadow:0 4px 0 #1A1A1A}
.secundario{background:transparent;color:#1A1A1A;border:2px solid #1A1A1A}
.ayuda{font:13px/1.45 'Oswald',Arial,sans-serif;color:#555;text-align:center;margin:2px 0 0}
.estado{font:15px/1.5 'Oswald',Arial,sans-serif;color:#1A1A1A;text-align:center;padding:40px 10px}
.estado b{display:block;font-family:'Bungee',sans-serif;font-weight:400;font-size:20px;margin-bottom:6px}
@media print{
  .acciones,.ayuda{display:none!important}
  .hoja,.papel{padding:0!important;box-shadow:none!important;-webkit-mask:none!important}
}
</style>
</head>
<body>
<main class="hoja">
  <div class="papel" id="papel"><div class="estado">Cargando tu ticket…</div></div>
  <div class="acciones" id="acciones" hidden>
    <button class="primario" type="button" id="pdf">Guardar en PDF</button>
    <p class="ayuda">Se abre la ventana de imprimir: elige “Guardar como PDF”.</p>
    <a class="secundario" id="whats" href="#" rel="noopener">Escríbenos por WhatsApp</a>
  </div>
</main>
<script>
(function () {
  const papel = document.getElementById('papel');
  const datos = new URLSearchParams(location.hash.slice(1));
  const folio = (datos.get('f') || '').toUpperCase();
  const clave = (datos.get('c') || '').toLowerCase();
  const whats = 'https://wa.me/525526577352?text=' + encodeURIComponent('Hola, tengo una duda con mi pedido ' + (folio || '') + '.');

  function error() {
    papel.innerHTML = '<div class="estado"><b>No encontramos este ticket</b>Revisa que el enlace esté completo, o escríbenos por WhatsApp con tu folio y te lo mandamos.</div>';
    const a = document.getElementById('acciones');
    a.hidden = false;
    document.getElementById('pdf').hidden = true;
    a.querySelector('.ayuda').hidden = true;
    document.getElementById('whats').href = whats;
  }

  if (!/^MX-[A-Z0-9]{4,8}$/.test(folio) || !/^[0-9a-f]{32}$/.test(clave) || typeof mextizzaTicketPublico !== 'function') return error();

  mextizzaTicketPublico(folio, clave).then(function (r) {
    const t = r.ticket;
    document.getElementById('estilos-ticket').textContent = mextizzaTicket.estilos(80);
    papel.innerHTML = mextizzaTicket.cuerpo(t, '/');
    document.title = 'Ticket ' + t.folio + ' · Mextizza';
    document.getElementById('acciones').hidden = false;
    document.getElementById('whats').href = whats;
    document.getElementById('pdf').onclick = function () { window.print(); };
  }).catch(error);
})();
</script>
</body>
</html>
