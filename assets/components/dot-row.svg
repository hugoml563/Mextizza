<svg xmlns="http://www.w3.org/2000/svg" width="200" height="32" viewBox="0 0 200 32">
  <!-- Mextizza dot row: rosa -> terracota -> dorado -> gris asfalto -> negro carbon,
       each with the brand's subtle ring. Swap the last circle's fill to #F5F0E8
       (blanco hueso) when placing this on a dark/negro-carbon panel. -->
  <circle cx="16"  cy="16" r="8" fill="#E4007C" stroke="rgba(0,0,0,0.08)" stroke-width="2"></circle>
  <circle cx="56"  cy="16" r="8" fill="#C1502E" stroke="rgba(0,0,0,0.08)" stroke-width="2"></circle>
  <circle cx="96"  cy="16" r="8" fill="#D9A65C" stroke="rgba(0,0,0,0.08)" stroke-width="2"></circle>
  <circle cx="136" cy="16" r="8" fill="#4A4A4A" stroke="rgba(0,0,0,0.08)" stroke-width="2"></circle>
  <circle cx="176" cy="16" r="8" fill="#1A1A1A" stroke="rgba(0,0,0,0.08)" stroke-width="2"></circle>
</svg>
