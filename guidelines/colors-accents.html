<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--surface-page)}.row{display:flex;gap:12px}.sw{flex:1}.fill{height:64px;border-radius:var(--radius-sm);border:var(--border-hairline)}.n{font:var(--fw-semibold) var(--fs-13)/1.3 var(--font-body);text-transform:uppercase;letter-spacing:var(--ls-half);margin-top:8px}.h{font:var(--type-mono);color:var(--text-muted)}.note{font:var(--type-caption);color:var(--text-muted);margin-top:10px}</style></head><body><div class="row"><div class="sw"><div class="fill" style="background:var(--rosa-mexicano)"></div><div class="n">Rosa Mexicano</div><div class="h">#E4007C</div></div><div class="sw"><div class="fill" style="background:var(--dorado-masa)"></div><div class="n">Dorado Masa</div><div class="h">#D9A65C</div></div><div class="sw"><div class="fill" style="background:var(--terracota-horno)"></div><div class="n">Terracota Horno</div><div class="h">#C1502E</div></div></div><p class="note">Rosa es acento, no fondo. La única excepción son la franja de cinta y el corte diagonal de redes. Rosa y terracota nunca se tocan a gran tamaño.</p></body></html>
