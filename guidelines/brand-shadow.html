<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page)}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.c{background:var(--surface-card);border:var(--border-paper);border-radius:var(--radius-md);padding:20px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between}.soft{box-shadow:var(--shadow-soft)}.b{align-self:flex-start;font-family:var(--font-body);font-weight:600;font-size:13px;letter-spacing:1px;text-transform:uppercase;background:var(--rosa-mexicano);color:var(--blanco);padding:11px 18px;border-radius:var(--radius-sm);box-shadow:var(--shadow-lift)}.k{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);line-height:1.6}</style></head><body>
<div class="row">
<div class="c soft"><div style="font-family:var(--font-body);font-weight:700;font-size:14px">Tarjeta</div><div class="k">--shadow-soft<br>0 1px 2px / 0 4px 12px · 5%</div></div>
<div class="c"><span class="b">Ordenar</span><div class="k">--shadow-lift<br>0 2px 0 negro · se aplana al presionar</div></div>
<div class="c"><img src="../assets/wordmark-mextizza.svg" alt="Mextizza" style="width:80%"><div class="k">--shadow-wordmark = none</div></div>
</div></body></html>
