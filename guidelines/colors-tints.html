<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page)}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.sw{border:var(--border-paper);border-radius:var(--radius-sm);height:76px}.n{font-family:var(--font-label);font-size:9.5px;letter-spacing:1px;text-transform:uppercase;margin-top:8px}.k{font:var(--type-mono);font-size:10px;color:var(--text-muted)}</style></head><body><div class="g">
<div><div class="sw" style="background:var(--blanco-hueso)"></div><div class="n">Blanco hueso · página</div><div class="k">--surface-page</div></div>
<div><div class="sw" style="background:var(--hueso-hondo)"></div><div class="n">Hueso hondo · bloque</div><div class="k">--surface-sunken</div></div>
<div><div class="sw" style="background:var(--blanco)"></div><div class="n">Blanco · tarjeta</div><div class="k">--surface-card</div></div>
<div><div class="sw" style="background:var(--rosa-tinte)"></div><div class="n">Tinte rosa</div><div class="k">--surface-accent-soft</div></div>
<div><div class="sw" style="background:var(--terracota-tinte)"></div><div class="n">Tinte terracota</div><div class="k">--surface-warm-soft</div></div>
<div><div class="sw" style="background:var(--dorado-tinte)"></div><div class="n">Tinte dorado</div><div class="k">--surface-dough</div></div>
</div></body></html>
