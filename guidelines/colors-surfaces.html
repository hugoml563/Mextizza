<!-- @dsCard group="Colors" viewport="700x150" name="Superficies semánticas" subtitle="surface-page es hueso; el blanco sólo para tarjetas encima" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--surface-page)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.c{border-radius:var(--radius-sm);border:var(--border-hairline);padding:14px;height:100px;display:flex;flex-direction:column;justify-content:flex-end}.t{font:var(--type-mono);font-size:11px}</style></head><body><div class="g">
<div class="c" style="background:var(--surface-page)"><span class="t">--surface-page</span></div>
<div class="c" style="background:var(--surface-card)"><span class="t">--surface-card</span></div>
<div class="c" style="background:var(--surface-inverse);color:var(--text-on-inverse)"><span class="t">--surface-inverse</span></div>
<div class="c" style="background:var(--surface-muted);color:var(--blanco)"><span class="t">--surface-muted</span></div>
</div></body></html>
